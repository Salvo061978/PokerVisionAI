name: Compila APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scarica sorgenti
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura SDK Android
        uses: android-actions/setup-android@v3
      - name: Installa Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compila APK debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerVisionAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk